# Netlify builds a preview of the documentation site for every pull request
# that touches docs/ (Deploy Previews). The published site stays on GitHub
# Pages; Netlify is only the preview.
[build]
  base = "docs"
  publish = "_site"
  # Served from the preview's root, so no /spec prefix.
  command = "bundle exec jekyll build --baseurl ''"
  # Exit 0 skips the build: nothing under docs/ (or this file) changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  RUBY_VERSION = "3.3"
  JEKYLL_ENV = "production"
