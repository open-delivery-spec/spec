name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ── Schema validation ─────────────────────────────────────────
  # The contracts live at schemas/<name>/v1.json. Each must compile as a JSON
  # Schema, and the conformance fixtures must satisfy the contracts they
  # exercise: every input.json is a policy-input document, every expected.json
  # a check-output document.
  schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install AJV
        run: npm install -g ajv-cli ajv-formats

      - name: Compile every schema
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(schemas/*/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No schema found under schemas/<name>/ — did the layout change?"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Compiling $f ..."
            ajv compile -s "$f" --strict=false --spec=draft2020 -c ajv-formats
          done

      - name: Validate the conformance fixtures against the contracts
        run: |
          set -euo pipefail
          ajv validate -s schemas/policy-input/v1.json -d "spec/conformance/*/input.json" \
            --strict=false --spec=draft2020 -c ajv-formats
          ajv validate -s schemas/check-output/v1.json -d "spec/conformance/*/expected.json" \
            --strict=false --spec=draft2020 -c ajv-formats

  # ── Example policies ──────────────────────────────────────────
  # The templates under examples/ are what adopters copy. Every one must
  # evaluate on every conformance input, and the open-source templates must
  # behave as docs/oss-ai-policy.md says (scripts/check-example-policies.sh).
  policy-examples:
    name: Example policies behave as documented
    runs-on: ubuntu-latest
    env:
      # Track the CLI's main tip directly: the module proxy's branch cache
      # lags fresh merges, and these templates are tested against the
      # policy-input contract the CLI implements today. Only the ODS module
      # bypasses the proxy; fetching every dependency straight from its VCS
      # (golang.org/x/* from go.googlesource.com) can hang for many minutes.
      GOPRIVATE: github.com/open-delivery-spec
    steps:
      - uses: actions/checkout@v7

      # This repository runs the open-source disclosure template on its own
      # pull requests, byte for byte: what adopters copy is what the
      # maintainers live with. A drift between the two fails here.
      - name: The repository runs the template it publishes
        run: diff -u examples/ods-policy-oss-disclosure.rego .ods/policy.rego

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - name: Install ODS CLI
        run: go install github.com/open-delivery-spec/cli/cmd/ods@main

      - name: Evaluate example policies against the conformance scenarios
        run: scripts/check-example-policies.sh

  # ── CLI ↔ spec ─────────────────────────────────────────────────
  # The reference CLI's outputs must satisfy the published contracts. Run the
  # four stages on this repository and validate each JSON document against
  # its schema, so a field added or renamed on one side fails here.
  schema-sync:
    name: CLI ↔ Spec Schema Sync
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/open-delivery-spec
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install ODS CLI and AJV
        run: |
          go install github.com/open-delivery-spec/cli/cmd/ods@main
          npm install -g ajv-cli ajv-formats

      - name: Run the pipeline on this repository
        env:
          ODS_DIFF_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          set -uo pipefail
          mkdir -p out
          # Exit codes carry the verdicts (AI detected, policy denied); only
          # the documents matter here.
          ods detect --json > out/detect.json || true
          ods analyze --json > out/analyze.json || true
          ods score --json > out/score.json || true
          ods check --json > out/check.json || true
          for f in out/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error::$f is not a JSON document"; exit 1; }
          done

      - name: Validate each output against its contract
        run: |
          set -euo pipefail
          for name in detect analyze score check; do
            echo "out/${name}.json against schemas/${name}-output/v1.json"
            ajv validate -s "schemas/${name}-output/v1.json" -d "out/${name}.json" \
              --strict=false --spec=draft2020 -c ajv-formats
          done
